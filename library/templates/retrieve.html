{%extends 'layout/app-layout.html'%}
{%block content%}
<h1>Retrieve Books</h1>
<table border="1">
    <tr><th>Book_id</th>
        <th>Book_title</th>
        <th>Book_author</th>
        <th>Book_year</th></tr>
        {%for books in book_list%}
    <tr>
    <td>{{books.id}}</td>
    <td>{{ books.title }} </td> 
    <td>{{ books.author }}</td>
    <td>{{ books.year }}</td></tr>
    <td ><a href="{%url 'updatebook' books.id %}" class="btn btn-success" value="edit" type="submit">Edit</a></td></tr>
    <td><a href="{%url 'deletebook' books.id %}" class="btn btn-success" value="edit" type="submit">Delete</a></td></tr>
     {% endfor %}
    </table> 

{%endblock%}
